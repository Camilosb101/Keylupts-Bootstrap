<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyluPets | Sistema de gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/landing/css/index.css" rel="stylesheet">
</head>
<body>
    <main class="inicio-pagina">
        <header class="barra-marca">
            <a href="index.html" class="marca" aria-label="Inicio KeyluPets">
                <img src="assets/landing/img/Icon_Huella.png" alt="Logo de KeyluPets" width="48" height="48">
                <span>KeyluPets</span>
            </a>
        </header>

        <section class="inicio-contenido" aria-labelledby="titulo-inicio">
            <div class="inicio-presentacion">
                <p class="etiqueta">Sistema digital de pedidos con stock</p>
                <h1 id="titulo-inicio">Gestiona KeyluPets desde un solo lugar.</h1>
                <p class="descripcion">Accede al sistema y selecciona el perfil con el que deseas trabajar.</p>
                <a href="pages/company/login.html" class="boton-acceso">
                    Iniciar sesión
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </a>
            </div>

            <aside class="resumen-sistema" aria-label="Módulos del sistema">
                <h2>Módulos disponibles</h2>
                <ul>
                    <li><i class="bi bi-box-seam" aria-hidden="true"></i> Gestión de inventario</li>
                    <li><i class="bi bi-cart3" aria-hidden="true"></i> Ventas y carrito</li>
                    <li><i class="bi bi-people" aria-hidden="true"></i> Usuarios y roles</li>
                    <li><i class="bi bi-bar-chart" aria-hidden="true"></i> Reportes y seguimiento</li>
                </ul>
            </aside>
        </section>
    </main>
</body>
</html>
