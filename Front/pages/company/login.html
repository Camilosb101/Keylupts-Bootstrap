<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyluPets</title>
    <!-- Bootstrap aporta la estructura responsive y sus clases de diseño. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons permite usar la lupa, el carrito, el perfil y la salida. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos propios para personalizar la interfaz y las tarjetas de productos. -->
    <link href="../../assets/landing/css/login.css" rel="stylesheet">
</head>
<body>
    <!-- Barra superior fija: permanece visible al desplazarse por la pagina. -->
    <div class="navbar sticky-top w-100 bg-white d-flex justify-content-start align-items-center gap-2 p-2">
        <!-- Enlace de inicio: la imagen y el nombre funcionan como un solo boton. -->
        <a href="login.html" class="d-flex align-items-center gap-2 text-dark text-decoration-none"
        aria-label="Inicio" title="Inicio">
            <img src="../../assets/landing/img/Icon_Huella.png" alt="Logo" 
            width="40"
            height="40"
            class="d-block">
            <span>𝗞𝗲𝘆𝗹𝘂𝗽𝗲𝘁𝘀</span>
        </a>
        <!-- Acceso al panel administrativo; ms-auto empuja este grupo a la derecha. -->
        <a href="../roles/admin.html" class="btn btn-outline-dark rounded-pill ms-auto"
        aria-label="Panel Admin"
        title="Panel Admin">
            Panel Admin
        </a>

        <!-- Acceso visual al perfil del usuario. -->
        <h5 type="button" class="btn border-0 bg-transparent text-dark fs-5"
        aria-label="Perfil"
        title="Perfil">
            <i class="bi bi-person" aria-hidden="true"></i>Admin 
    </h5>

        
        <!-- Boton del carrito; solo muestra el icono, sin fondo ni borde. -->
        <button type="button" class="btn border-0 bg-transparent text-dark fs-5" 
        aria-label="Carrito de compras" 
        title="Carrito de compras">
            <i class="bi bi-cart3" aria-hidden="true"></i>
        </button>

        <!-- Boton para cerrar la sesion. -->
        <button type="button" class="btn btn-light text-danger fs-5">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            Salir
        </button>
    </div>

    <!-- Zona de busqueda y filtros de categorias. -->
    <div class="container mt-3">
        <!-- input-group une el icono y el campo como una sola barra de busqueda. -->
        <div class="input-group rounded-pill overflow-hidden barra-busqueda">
            <span class="input-group-text">
                <i class="bi bi-search" aria-hidden="true"></i>
            </span>
            <input type="search" class="form-control" placeholder="Buscar productos" aria-label="Buscar productos">
        </div>
        <!-- Filtros visuales para mostrar todos o una categoria especifica. -->
        <div class="d-flex justify-content-start gap-2 mt-2 flex-wrap">
            <button type="button" class="btn btn-categoria">Todos</button>
            <button type="button" class="btn btn-categoria">Comida</button>
            <button type="button" class="btn btn-categoria">Accesorios</button>
            <button type="button" class="btn btn-categoria">Juguetes</button>
        </div>
        <!-- Mensaje informativo secundario para el usuario administrador. -->
        <p class="text-muted small mt-2 mb-0">Bienvenido/a, Admin KeyluPets</p>
    </div>
   
</body>
</html>
