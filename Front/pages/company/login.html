<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | KeyluPets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../assets/landing/css/login.css" rel="stylesheet">
</head>
<body>
    <main class="login-page">
        <header class="brand-header">
            <a href="login.html" class="brand-link" aria-label="Inicio KeyluPets">
                <img src="../../assets/landing/img/Icon_Huella.png" alt="Logo de KeyluPets" width="58" height="58">
                <span>KeyluPets</span>
            </a>
            <p>¡Bienvenido de vuelta! Inicia sesión en tu cuenta</p>
        </header>

        <section class="login-card" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar Sesión</h1>

            <form method="get" class="login-form">
                <div class="campo-formulario">
                    <label for="correo" class="form-label">
                        <i class="bi bi-envelope" aria-hidden="true"></i>
                        Correo Electrónico
                    </label>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="Ingresa tu correo" autocomplete="email" required>
                </div>

                <div class="campo-formulario">
                    <label for="contrasena" class="form-label">
                        <i class="bi bi-lock" aria-hidden="true"></i>
                        Contraseña
                    </label>
                    <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                </div>

                <a href="#seleccion-rol" class="enlace-ayuda">¿Olvidaste tu contraseña?</a>

                <div class="seleccion-rol" id="seleccion-rol">
                    <h2>Selecciona cómo deseas ingresar</h2>
                    <p>Elige el rol que utilizarás para acceder al sistema.</p>
                    <div class="botones-rol">
                        <button type="submit" class="boton-rol boton-admin" formaction="../roles/admin.html">
                            <i class="bi bi-shield-lock" aria-hidden="true"></i>
                            Administrador
                        </button>
                        <button type="submit" class="boton-rol boton-empleado" formaction="../roles/empleado.html">
                            <i class="bi bi-person-badge" aria-hidden="true"></i>
                            Empleado
                        </button>
                        <button type="submit" class="boton-rol boton-usuario" formaction="../roles/usuario.html">
                            <i class="bi bi-person" aria-hidden="true"></i>
                            Usuario
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
