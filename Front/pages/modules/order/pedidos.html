<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | KeyluPets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../../assets/landing/css/admin.css" rel="stylesheet">
    <link href="../../../assets/landing/css/pedidos.css" rel="stylesheet">
</head>
<body>
    <div class="navbar barra-superior sticky-top w-100 bg-white d-flex justify-content-start align-items-center gap-2 p-2">
        <a href="../../roles/admin.html" class="d-flex align-items-center gap-2 text-dark text-decoration-none"
        aria-label="Inicio" title="Inicio">
            <img src="../../../assets/landing/img/Icon_Huella.png" alt="Logo"
            width="40"
            height="40"
            class="d-block">
            <span class="d-flex flex-column align-items-start">
                <span>𝗞𝗲𝘆𝗹𝘂𝗽𝗲𝘁𝘀</span>
                <small class="text-secondary">Panel administrativo</small>
            </span>
        </a>

        <a href="../../company/login.html" class="btn btn-outline-dark rounded-pill ms-auto"
        aria-label="Ver tienda" title="Ver tienda">
        <i class="bi bi-shop" aria-hidden="true"></i>
            Ver tienda
        </a>

        <span class="text-dark fs-6 me-n6" aria-label="Tipo de usuario" title="Tipo de usuario">
            Admin Keylupets
        </span>

        <button type="button" class="btn bg-transparent text-danger fs-6">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            𝘊𝘦𝘳𝘳𝘢𝘳 𝘚𝘦𝘴𝘪𝘰𝘯
        </button>
    </div>

    <div class="admin-layout">
        <aside class="panel-navegacion" aria-label="Navegacion administrativa">
            <a href="../../roles/admin.html#panel-control" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">📊</span>
                <span>Panel de control</span>
            </a>
            <a href="../inventory/inventory.html" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">📦</span>
                <span>Inventario</span>
            </a>
            <a href="pedidos.html" class="opcion-navegacion activa" aria-current="page">
                <span class="emoji-navegacion" aria-hidden="true">🛒</span>
                <span>Pedidos</span>
            </a>
            <a href="../../roles/admin.html#perfiles-usuario" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">👤</span>
                <span>Perfiles de usuario</span>
            </a>
            <a href="../../roles/admin.html#reportes" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">📈</span>
                <span>Reportes</span>
            </a>
        </aside>

        <main class="admin-contenido">
            <div class="pedidos-encabezado-pagina">
                <h1 class="titulo-panel">Gestión de Pedidos</h1>
            </div>

            <div class="filtros-pedidos" role="group" aria-label="Filtrar pedidos">
                <button type="button" class="filtro-pedido activo" aria-pressed="true">Todos</button>
                <button type="button" class="filtro-pedido" aria-pressed="false">Pendientes</button>
                <button type="button" class="filtro-pedido" aria-pressed="false">Completados</button>
                <button type="button" class="filtro-pedido" aria-pressed="false">Vencidos</button>
            </div>

            <section class="pedidos-vacio" aria-labelledby="titulo-pedidos-vacio">
                <i class="bi bi-bag-x pedidos-vacio-icono" aria-hidden="true"></i>
                <h2 id="titulo-pedidos-vacio">No hay pedidos registrados</h2>
                <p>Los pedidos aparecerán aquí cuando sean creados.</p>
            </section>
        </main>
    </div>
</body>
</html>
