<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | KeyluPets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../assets/landing/css/admin.css" rel="stylesheet">
</head>
<body>
    <header class="navbar barra-superior sticky-top w-100 bg-white d-flex justify-content-start align-items-center gap-2 p-2">
        <a href="../company/catalogo-admin.html" class="d-flex align-items-center gap-2 text-dark text-decoration-none"
        aria-label="Inicio" title="Inicio">
            <img src="../../assets/landing/img/Icon_Huella.png" alt="Logo de KeyluPets"
            width="40"
            height="40"
            class="d-block">
            <span class="d-flex flex-column align-items-start">
                <span class="fw-bold">KeyluPets</span>
                <small class="text-secondary">Panel administrativo</small>
            </span>
        </a>

        <a href="../company/catalogo-admin.html" class="btn btn-outline-dark rounded-pill ms-auto"
        aria-label="Ver catálogo" title="Ver catálogo">
            <i class="bi bi-shop" aria-hidden="true"></i>
            Ver catálogo
        </a>

        <span class="text-dark fs-6" aria-label="Tipo de usuario" title="Tipo de usuario">
            Admin Keylupets
        </span>

        <a href="../company/login.html" class="btn bg-transparent text-danger fs-6" aria-label="Cerrar sesión" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            Cerrar Sesión
        </a>
    </header>

    <div class="admin-layout">
        <aside class="panel-navegacion" aria-label="Navegacion administrativa">
            <a href="admin.html#panel-control" class="opcion-navegacion activa">
                <span class="emoji-navegacion" aria-hidden="true">📊</span>
                <span>Panel de control</span>
            </a>
            <a href="../modules/inventory/inventory.html" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">📦</span>
                <span>Inventario</span>
            </a>
            <a href="../modules/pedidos/pedidos.html" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">🛒</span>
                <span>Pedidos</span>
            </a>
            <a href="../modules/users/perfiles.html" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">👤</span>
                <span>Perfiles de usuario</span>
            </a>
            <a href="../modules/reports/reportes.html" class="opcion-navegacion">
                <span class="emoji-navegacion" aria-hidden="true">📈</span>
                <span>Reportes</span>
            </a>
        </aside>

        <main class="admin-contenido" id="panel-control">
            <h1 class="titulo-panel">Panel Principal</h1>

            <section class="resumen-panel row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-4" aria-label="Resumen del inventario y pedidos">
                <div class="col">
                    <article class="tarjeta-resumen h-100">
                        <div class="resumen-encabezado">
                            <h2>Total Productos</h2>
                            <i class="bi bi-box-seam icono-productos" aria-hidden="true"></i>
                        </div>
                        <strong class="resumen-numero" id="total-productos">0</strong>
                    </article>
                </div>

                <div class="col">
                    <article class="tarjeta-resumen h-100">
                        <div class="resumen-encabezado">
                            <h2>Pedidos Pendientes</h2>
                            <i class="bi bi-bag icono-pedidos" aria-hidden="true"></i>
                        </div>
                        <strong class="resumen-numero" id="pedidos-pendientes">0</strong>
                    </article>
                </div>

                <div class="col">
                    <article class="tarjeta-resumen tarjeta-alerta h-100">
                        <div class="resumen-encabezado">
                            <h2>Stock Bajo</h2>
                            <i class="bi bi-exclamation-triangle icono-stock" aria-hidden="true"></i>
                        </div>
                        <strong class="resumen-numero" id="stock-bajo">0</strong>
                    </article>
                </div>

                <div class="col">
                    <article class="tarjeta-resumen h-100">
                        <div class="resumen-encabezado">
                            <h2>Por Vencer Pronto</h2>
                            <i class="bi bi-clock icono-vencimiento" aria-hidden="true"></i>
                        </div>
                        <strong class="resumen-numero" id="por-vencer">0</strong>
                    </article>
                </div>
            </section>

            <section class="alerta-stock" role="alert">
                <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
                <h2>Alerta de Stock Bajo</h2>
            </section>

            <section class="pedidos-recientes" aria-label="Pedidos recientes">
                <div class="pedidos-encabezado">
                    <i class="bi bi-bell" aria-hidden="true"></i>
                    <h2>Pedidos Recientes</h2>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
